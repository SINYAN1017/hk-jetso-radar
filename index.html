<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>香港每日著數搶購雷達 | HK Jetso Radar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'ui-monospace', 'monospace'],
          },
        },
      },
    };
  </script>
  <style>
    :root { color-scheme: light; }
    html.dark { color-scheme: dark; }
    body {
      background-color: #f3efe4;
      background-image:
        radial-gradient(ellipse 70% 45% at 100% -8%, rgba(190, 230, 40, 0.35), transparent 55%),
        radial-gradient(ellipse 45% 35% at -8% 18%, rgba(255, 92, 46, 0.12), transparent 50%);
    }
    html.dark body {
      background-color: #0c0d0a;
      background-image:
        radial-gradient(ellipse 70% 45% at 100% -8%, rgba(214, 255, 70, 0.16), transparent 55%),
        radial-gradient(ellipse 50% 40% at -10% 30%, rgba(255, 92, 46, 0.14), transparent 50%);
    }
    body::before {
      content: "";
      pointer-events: none;
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(18, 18, 18, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(18, 18, 18, 0.045) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse at top, #000 20%, transparent 78%);
    }
    html.dark body::before {
      background-image:
        linear-gradient(rgba(243, 239, 228, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(243, 239, 228, 0.05) 1px, transparent 1px);
    }
    .live-dot {
      box-shadow: 0 0 0 0 rgba(22, 22, 22, 0.45);
      animation: ping-dot 1.8s ease-out infinite;
    }
    html.dark .live-dot { box-shadow: 0 0 0 0 rgba(228, 255, 106, 0.7); }
    @keyframes ping-dot {
      70% { box-shadow: 0 0 0 8px transparent; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }
    @keyframes rise-in {
      from { transform: translateY(8px); }
      to { transform: none; }
    }
    .deal-card { animation: rise-in 0.45s ease both; }
    .deal-card:nth-child(2) { animation-delay: 0.04s; }
    .deal-card:nth-child(3) { animation-delay: 0.08s; }
    .deal-card:nth-child(4) { animation-delay: 0.12s; }
    @media (prefers-reduced-motion: reduce) {
      .live-dot, .deal-card { animation: none; }
    }
    .chip-row { scrollbar-width: none; }
    .chip-row::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="text-[#161616] dark:text-[#f6f3ea] min-h-screen font-sans antialiased">
  <div class="relative max-w-5xl mx-auto px-4 sm:px-6 py-6 sm:py-10">
    <header class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-5 mb-8">
      <div>
        <p class="text-[11px] font-mono tracking-[0.28em] uppercase text-[#5c5a52] dark:text-[#c8c3b4] mb-2">HK Jetso Radar</p>
        <h1 class="text-[1.7rem] sm:text-4xl font-black tracking-tight leading-none flex flex-wrap items-center gap-x-3 gap-y-2">
          <span>⚡ 香港每日著數雷達</span>
          <span class="inline-flex items-center gap-1.5 text-[11px] font-bold px-2.5 py-1 rounded-full bg-[#d6f25c] text-[#161616]">
            <span class="live-dot inline-block w-1.5 h-1.5 rounded-full bg-[#161616]"></span>
            自動更新
          </span>
        </h1>
        <p id="lastUpdated" class="text-sm text-[#5c5a52] dark:text-[#c8c3b4] mt-3">正在讀取最新情報...</p>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <button id="notifyBtn" type="button" class="px-3.5 py-2 text-sm font-medium rounded-full border border-[#161616]/15 dark:border-[#f6f3ea]/20 bg-[#f7f4ec]/80 dark:bg-[#171812]/80 backdrop-blur hover:bg-[#161616] hover:text-[#f6f3ea] dark:hover:bg-[#f6f3ea] dark:hover:text-[#161616] transition">
          🔔 開啟突發通知
        </button>
        <button id="refreshBtn" type="button" class="px-3.5 py-2 text-sm font-bold rounded-full bg-[#161616] text-[#f6f3ea] dark:bg-[#d6f25c] dark:text-[#161616] hover:opacity-90 transition">
          🔄 立即重載
        </button>
        <button id="themeBtn" type="button" class="w-10 h-10 text-sm rounded-full border border-[#161616]/15 dark:border-[#f6f3ea]/20 bg-[#f7f4ec]/80 dark:bg-[#171812]/80 hover:bg-[#161616] hover:text-[#f6f3ea] dark:hover:bg-[#f6f3ea] dark:hover:text-[#161616] transition" aria-label="切換外觀">
          🌙
        </button>
      </div>
    </header>

    <section class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-7">
      <div class="p-5 sm:p-6 rounded-[1.6rem] bg-[#f7f4ec]/90 dark:bg-[#171812]/90 border border-[#161616]/10 dark:border-[#f6f3ea]/10 shadow-[0_18px_40px_-28px_rgba(22,22,22,0.45)] backdrop-blur">
        <div class="text-[11px] font-mono uppercase tracking-[0.22em] text-[#5c5a52] dark:text-[#c8c3b4]">香港即時時間 (HKT)</div>
        <div id="hktClock" class="text-4xl sm:text-5xl font-mono font-semibold tracking-tight mt-3 tabular-nums">--:--:--</div>
        <div id="hktDate" class="text-sm text-[#5c5a52] dark:text-[#c8c3b4] mt-2"></div>
      </div>
      <div class="relative overflow-hidden p-5 sm:p-6 rounded-[1.6rem] bg-[#161616] text-[#f6f3ea] shadow-[0_18px_40px_-24px_rgba(22,22,22,0.7)]">
        <div class="pointer-events-none absolute -right-8 -top-10 w-40 h-40 rounded-full border border-[#d6f25c]/30"></div>
        <div class="pointer-events-none absolute -right-2 -top-4 w-24 h-24 rounded-full border border-[#d6f25c]/50"></div>
        <div class="relative text-[11px] font-mono uppercase tracking-[0.22em] text-[#d6f25c]">下一輪限時開搶倒數</div>
        <div id="nextCountdown" class="relative text-4xl sm:text-5xl font-mono font-semibold tracking-tight mt-3 text-[#d6f25c] tabular-nums">--:--:--</div>
        <div id="nextDealTitle" class="relative text-sm text-[#f6f3ea]/75 mt-2 truncate">掃描今日時段中...</div>
      </div>
    </section>

    <section class="mb-6">
      <input id="searchInput" type="search" placeholder="搜尋機票、自助餐、買一送一、商戶..." class="w-full px-4 py-3 rounded-2xl border border-[#161616]/12 dark:border-[#f6f3ea]/15 bg-[#f7f4ec]/90 dark:bg-[#171812]/90 text-sm placeholder:text-[#8a867b] focus:outline-none focus:ring-2 focus:ring-[#161616] dark:focus:ring-[#d6f25c]" />
      <div id="categoryBar" class="chip-row mt-3 flex gap-2 items-center overflow-x-auto pb-1"></div>
    </section>

    <main id="dealsContainer" class="space-y-3"></main>
  </div>

  <script>
    const CATEGORIES = ['全部', '⚡ 突發快閃', '網上報料', '機票旅遊', '飲食著數', '酒店自助餐', '網購信用卡', '其他', '⭐ 已收藏'];
    let allDeals = [];
    let knownIds = new Set();
    let activeCategory = '全部';
    let favorites = new Set(JSON.parse(localStorage.getItem('hk_jetso_favs') || '[]'));

    // Theme init
    if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
    document.getElementById('themeBtn').onclick = () => {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    };

    // Notification permission
    const notifyBtn = document.getElementById('notifyBtn');
    function updateNotifyBtn() {
      if (!('Notification' in window)) { notifyBtn.classList.add('hidden'); return; }
      if (Notification.permission === 'granted') {
        notifyBtn.textContent = '✅ 已開突發通知';
        notifyBtn.classList.add('border-emerald-500', 'text-emerald-600', 'dark:text-emerald-400');
      }
    }
    notifyBtn.onclick = async () => {
      if ('Notification' in window) {
        await Notification.requestPermission();
        updateNotifyBtn();
      }
    };
    updateNotifyBtn();

    // Render Category Buttons
    function renderCategories() {
      const bar = document.getElementById('categoryBar');
      bar.innerHTML = '';
      CATEGORIES.forEach(cat => {
        const btn = document.createElement('button');
        const active = cat === activeCategory;
        btn.type = 'button';
        btn.className = `shrink-0 px-3.5 py-1.5 text-xs font-bold rounded-full transition ${
          active
            ? 'bg-[#161616] text-[#d6f25c] dark:bg-[#d6f25c] dark:text-[#161616]'
            : 'bg-[#f7f4ec]/80 dark:bg-[#171812]/80 border border-[#161616]/12 dark:border-[#f6f3ea]/15 hover:border-[#161616] dark:hover:border-[#d6f25c]'
        }`;
        btn.textContent = cat;
        btn.onclick = () => { activeCategory = cat; renderCategories(); renderDeals(); };
        bar.appendChild(btn);
      });
    }

    // Export .ics reminder (5 mins before grab time)
    function downloadICS(deal) {
      const nowHK = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Hong_Kong' }));
      let [hh, mm] = deal.time.includes(':') ? deal.time.split(':').map(Number) : [12, 0];
      const start = new Date(nowHK.getFullYear(), nowHK.getMonth(), nowHK.getDate(), hh, mm - 5, 0);
      const end = new Date(start.getTime() + 15 * 60000);
      const fmt = d => d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
      const ics = [
        'BEGIN:VCALENDAR', 'VERSION:2.0', 'BEGIN:VEVENT',
        `DTSTART:${fmt(start)}`, `DTEND:${fmt(end)}`,
        `SUMMARY:⚡ 搶購提醒：${deal.title}`,
        `DESCRIPTION:${deal.summary}\\n連結：${deal.url}`,
        'END:VEVENT', 'END:VCALENDAR'
      ].join('\r\n');
      const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `jetso-${deal.id}.ics`;
      a.click();
    }

    function toggleFav(id) {
      if (favorites.has(id)) favorites.delete(id); else favorites.add(id);
      localStorage.setItem('hk_jetso_favs', JSON.stringify([...favorites]));
      renderDeals();
    }

    function renderDeals() {
      const kw = document.getElementById('searchInput').value.trim().toLowerCase();
      const filtered = allDeals.filter(d => {
        if (activeCategory === '⚡ 突發快閃' && !d.is_flash) return false;
        else if (activeCategory === '⭐ 已收藏' && !favorites.has(d.id)) return false;
        else if (!['全部', '⚡ 突發快閃', '⭐ 已收藏'].includes(activeCategory) && d.category !== activeCategory) return false;
        if (kw && !(`${d.title} ${d.platform} ${d.summary}`.toLowerCase().includes(kw))) return false;
        return true;
      });

      const container = document.getElementById('dealsContainer');
      if (!filtered.length) {
        container.innerHTML = `<div class="p-10 text-center text-[#5c5a52] dark:text-[#c8c3b4] bg-[#f7f4ec]/90 dark:bg-[#171812]/90 rounded-[1.6rem] border border-dashed border-[#161616]/20 dark:border-[#f6f3ea]/20">暫時未有符合條件嘅著數。</div>`;
        return;
      }

      container.innerHTML = filtered.map(d => {
        const isFav = favorites.has(d.id);
        const isNew = (Date.now() - new Date(d.added_at).getTime()) < 2 * 3600 * 1000;
        const edge = d.is_flash
          ? 'border-[#ff5c2e]/70 shadow-[0_16px_36px_-28px_rgba(255,92,46,0.9)]'
          : 'border-[#161616]/10 dark:border-[#f6f3ea]/10';
        return `
          <article class="deal-card p-4 sm:p-5 rounded-[1.4rem] bg-[#f7f4ec]/95 dark:bg-[#171812]/95 border ${edge} flex flex-col sm:flex-row sm:items-center justify-between gap-4 transition hover:-translate-y-0.5">
            <div class="flex items-start gap-3 sm:gap-4 min-w-0">
              <div class="shrink-0 w-[4.5rem] text-center py-2 rounded-2xl font-mono font-semibold text-sm tracking-tight ${d.time === '全日' ? 'bg-[#161616]/6 text-[#161616] dark:bg-[#f6f3ea]/10 dark:text-[#f6f3ea]' : 'bg-[#d6f25c] text-[#161616]'}">
                ${d.time}
              </div>
              <div class="min-w-0">
                <div class="flex flex-wrap items-center gap-1.5 mb-1.5">
                  ${d.is_flash ? '<span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-[#ff5c2e] text-white">⚡ 突發快閃</span>' : ''}
                  ${isNew ? '<span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-[#161616] text-[#d6f25c]">🆕 新上架</span>' : ''}
                  <span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-[#161616]/6 dark:bg-[#f6f3ea]/10 text-[#3a3832] dark:text-[#e7e2d4]">${d.category}</span>
                  <span class="text-[11px] font-bold tracking-wide text-[#161616] dark:text-[#d6f25c]">${d.platform}</span>
                </div>
                <h2 class="font-black text-base sm:text-lg leading-snug">${d.title}</h2>
                <p class="text-sm text-[#4e4c45] dark:text-[#d5d0c3] mt-1 leading-relaxed">${d.summary}</p>
              </div>
            </div>
            <div class="flex sm:flex-col items-center sm:items-end gap-2 shrink-0">
              <a href="${d.url}" target="_blank" rel="noopener noreferrer" class="px-3.5 py-2 text-xs font-bold rounded-full bg-[#161616] text-[#f6f3ea] dark:bg-[#d6f25c] dark:text-[#161616] hover:opacity-90">${d.category === '網上報料' ? '查看貼文' : '即去搶購'} ↗</a>
              <div class="flex gap-1.5">
                <button onclick='downloadICS(${JSON.stringify(d).replace(/'/g, "'")})' class="px-2.5 py-1 text-xs rounded-full border border-[#161616]/15 dark:border-[#f6f3ea]/20 hover:bg-[#161616] hover:text-[#f6f3ea] dark:hover:bg-[#f6f3ea] dark:hover:text-[#161616] transition" title="加入日曆提醒">📅 提醒</button>
                <button onclick="toggleFav('${d.id}')" class="px-2.5 py-1 text-xs rounded-full border border-[#161616]/15 dark:border-[#f6f3ea]/20 hover:bg-[#161616] hover:text-[#f6f3ea] dark:hover:bg-[#f6f3ea] dark:hover:text-[#161616] transition">${isFav ? '⭐' : '☆'}</button>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    async function loadDeals(isBackground = false) {
      try {
        const res = await fetch(`./deals.json?t=${Date.now()}`);
        const data = await res.json();
        const incoming = data.deals || [];

        // 背景更新時檢查有冇新突發優惠並發桌面通知
        if (isBackground && knownIds.size > 0) {
          const fresh = incoming.filter(d => !knownIds.has(d.id));
          if (fresh.length > 0 && 'Notification' in window && Notification.permission === 'granted') {
            new Notification(`⚡ 有 ${fresh.length} 個新香港著數！`, {
              body: `${fresh[0].time} ${fresh[0].title}`
            });
          }
        }

        allDeals = incoming;
        knownIds = new Set(allDeals.map(d => d.id));

        if (data.updated_at) {
          const dt = new Date(data.updated_at).toLocaleString('zh-HK', { timeZone: 'Asia/Hong_Kong' });
          document.getElementById('lastUpdated').textContent = `最後自動同步：${dt}（每 15 分鐘雲端掃描一次）`;
        }
        renderDeals();
      } catch (e) {
        document.getElementById('lastUpdated').textContent = '暫時無法讀取 deals.json，請稍後重試。';
      }
    }

    // Live HKT Clock & Countdown
    function tickClock() {
      const now = new Date();
      const hkStr = now.toLocaleTimeString('en-GB', { timeZone: 'Asia/Hong_Kong', hour12: false });
      const hkDate = now.toLocaleDateString('zh-HK', { timeZone: 'Asia/Hong_Kong', weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      document.getElementById('hktClock').textContent = hkStr;
      document.getElementById('hktDate').textContent = hkDate;

      const [ch, cm, cs] = hkStr.split(':').map(Number);
      const nowSec = ch * 3600 + cm * 60 + cs;

      const timedDeals = allDeals
        .filter(d => /^\d{2}:\d{2}$/.test(d.time))
        .map(d => {
          const [h, m] = d.time.split(':').map(Number);
          return { ...d, sec: h * 3600 + m * 60 };
        })
        .filter(d => d.sec > nowSec)
        .sort((a, b) => a.sec - b.sec);

      if (timedDeals.length > 0) {
        const diff = timedDeals[0].sec - nowSec;
        const hh = String(Math.floor(diff / 3600)).padStart(2, '0');
        const mm = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
        const ss = String(diff % 60).padStart(2, '0');
        document.getElementById('nextCountdown').textContent = `${hh}:${mm}:${ss}`;
        document.getElementById('nextDealTitle').textContent = `[${timedDeals[0].time}] ${timedDeals[0].title}`;
      } else {
        document.getElementById('nextCountdown').textContent = '今日已開搶';
        document.getElementById('nextDealTitle').textContent = '目前顯示全日及已開搶著數，有突發會自動加入';
      }
    }

    document.getElementById('searchInput').oninput = renderDeals;
    document.getElementById('refreshBtn').onclick = () => loadDeals(false);

    renderCategories();
    loadDeals(false);
    setInterval(tickClock, 1000);
    tickClock();

    // 開住網頁時，每 5 分鐘靜默檢查一次 deals.json 有冇更新
    setInterval(() => {
      if (!document.hidden) loadDeals(true);
    }, 5 * 60 * 1000);
  </script>
</body>
</html>
