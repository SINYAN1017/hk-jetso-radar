# Auto Update HK Jetso Deals
#
# Schedule is UTC. Hong Kong is UTC+8 year-round.
# 08:00–22:45 HKT == 00:00–14:45 UTC, every 15 minutes (:00/:15/:30/:45).
# Hour 0–14 with those minutes includes 14:45 UTC (22:45 HKT) and stops
# before 15:00 UTC (23:00 HKT).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   GEMINI_API_KEY        required — script exits if this is missing
#   TELEGRAM_BOT_TOKEN    optional — Telegram push is skipped if unset
#   TELEGRAM_CHAT_ID      optional — Telegram push is skipped if unset
#   THREADS_ACCESS_TOKEN  optional — Threads keyword search is skipped if unset

name: Auto Update HK Jetso Deals

on:
  schedule:
    - cron: "0,15,30,45 0-14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-hk-jetso-deals
  cancel-in-progress: false

jobs:
  update-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch deals
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python scripts/fetch_deals.py

      - name: Commit and push deals.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- deals.json
          if git diff --cached --quiet; then
            echo "deals.json unchanged; skip commit."
            exit 0
          fi
          git commit -m "Update deals.json"
          git push
